---
layout: page
title: Primary Sources
permalink: /primary-sources/
---

<div class="post-list">

  {% for post in site.posts %}
    {% if post.sections contains "primary-sources" %}

      <article class="post-preview">

        <h2>
          <a href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h2>

        <p class="post-meta">
          {{ post.date | date: "%B %-d, %Y" }}
        </p>

        <div class="post-excerpt">
          {{ post.excerpt }}
        </div>

      </article>

    {% endif %}
  {% endfor %}

</div>
