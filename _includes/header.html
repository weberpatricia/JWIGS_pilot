<header class="site-header">

  <div class="wrapper">
    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.minima.nav_pages | default: default_paths -%}
    {%- assign page_titles = site.pages | map: 'title' | compact %}


<div class="header-row">

  
  <div class="header-logo-left">
    <a href="{{ '/' | relative_url }}">
      <img class="jwigs-logo"
           src="{{ '/assets/images/jwigs.png' | relative_url }}"
           alt="{{ site.title | escape }}">
    </a>
  </div>

  <div class="header-right">

    <div class="header-logo">

      <!-- Existing logo -->
      <img class="main-logo"
           src="{{ '/assets/images/logo.png' | relative_url }}"
           alt="{{ site.title | escape }}">
    
    </div>
  
    {%- unless page_titles == empty %}
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon"></span>
        </label>
  
        {% include nav-items.html paths = page_paths %}
      </nav>
    {%- endunless %}
  
  </div>

  </div>

</div>


  </div>
</header>
